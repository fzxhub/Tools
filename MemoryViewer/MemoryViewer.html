<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MemoryViewer · 数值 ⇄ 内存字节</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='28%25' r='72%25'%3E%3Cstop offset='0' stop-color='%23bdf5d5'/%3E%3Cstop offset='45%25' stop-color='%234fd39a'/%3E%3Cstop offset='100%25' stop-color='%230f8a5a'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='url(%23g)'/%3E%3Ccircle cx='11.5' cy='10.5' r='3.1' fill='%23ffffff' opacity='.55'/%3E%3C/svg%3E">
<script>
/* 主题必须在首次绘制前定下来，否则会先闪一下深色再跳亮色。
   策略：本地有记录就用记录，没有就跟随系统（prefers-color-scheme）。
   这里的 localStorage 可能被 file:// 或隐私模式拒绝，一律 try 住。 */
(function () {
  /* 主题偏好三档：'system'（跟随系统）/ 'light' / 'dark'。
     读不到配置、或值不合法（旧版本遗留、手改过的值），一律回落到 'system'。
     注意 pybuild/app.py 里也有一个 DEFAULT_THEME，窗口底色要用同一个值，改这里记得同步。 */
  var DEFAULT_THEME = 'system';

  function normalize(v) {
    return (v === 'system' || v === 'light' || v === 'dark') ? v : DEFAULT_THEME;
  }

  function sysLight() {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
  }

  var pref = DEFAULT_THEME;
  try { pref = normalize(localStorage.getItem('mv-theme')); } catch (e) { pref = DEFAULT_THEME; }

  var root = document.documentElement;
  root.setAttribute('data-theme-pref', pref);
  /* data-theme 始终是「实际生效」的那套，CSS 只认它；data-theme-pref 记录用户选择 */
  root.setAttribute('data-theme', pref === 'system' ? (sysLight() ? 'light' : 'dark') : pref);
})();
</script>
<style>
/* ================= 主题变量 =================
   所有颜色都走语义变量，切换主题只改 <html data-theme>。
   深色是默认值（没有 data-theme 时仍按深色渲染），明亮主题整片覆盖。
   命名按「用途」而不是「颜色」，这样两套主题才能各配各的色值。 */
:root{
  color-scheme: dark;

  /* 底色与光晕 */
  --bg:#0a0e13;
  --glow1:rgba(38,92,124,.30);
  --glow2:rgba(92,62,150,.20);
  --card-grad:linear-gradient(180deg,#141c27 0%, #101620 100%);
  --card-shadow:0 12px 30px -22px rgba(0,0,0,.9);

  --panel2:#18212e;
  --line:#243140;

  --txt:#dde7f2;
  --dim:#7b8da1;

  --accent:#35d6ac;
  --purple:#b18bfa;
  --orange:#f0a34a;
  --red:#f4737f;
  --teal:#4fd1c5;

  /* 输入框 / 字节框 / 结果表的「凹陷」面 */
  --sunken:#0b1119;
  --sunken-line:#1e2836;
  --field-line:#22303f;
  --field-focus:#2f7d6b;
  --focus-ring:rgba(53,214,172,.10);

  --seg-on-bg:#23324a;
  --seg-on-line:#2e4a63;

  --chip-bg:#161f2b;
  --chip-txt:#96a8bc;

  --hexb-bg:#1b2836;
  --hexb-line:#2c3d51;
  --hexb-txt:#6ff0cd;
  --hexb-hv-bg:#26405a;
  --hexb-hv-line:#3d6d8f;
  --hexb-hv-txt:#b8ffe9;

  --divider:#151e2a;
  --divider2:#17202c;

  --tag:#5b7089;
  --tlabel:#7089a1;
  --rval:#e2ecf6;
  --empty:#5b7089;
  --sup:#6b8299;
  --meta:#6d8095;
  --hint:#57697d;
  --hl-grad:rgba(53,214,172,.07);
  --hl-t:#5fc9ab;

  --note:#7f93a8;
  --note-dot:#3d6d8f;
  --note-warn:#e9b070;
  --note-ok:#66c9a6;

  --btn-bg:#18212e;
  --btn-line:#243140;
  --btn-txt:#a8bccf;
  --btn-hv-bg:#132019;
  --btn-hv-line:#2f7d6b;
  --pri-bg:#1d3a33;
  --pri-line:#2f7d6b;
  --pri-txt:#6ff0cd;
  --pri-hv:#26503f;

  --thumb:#2b3b4d;
  --thumb-hv:#3b5068;

  --toast-bg:#1d2b3a;
  --toast-line:#2f4a63;
  --toast-txt:#8ff5da;
  --toast-shadow:0 14px 34px -14px rgba(0,0,0,.9);

  --alt-bg:#141d28;
  --alt-lbl:#5b7089;
  --alt-val:#93aec7;
  --sep:#33465a;

  --kv-line:#1a2432;
  --kv-label:#64798f;
  --kv-val:#d6e4f0;
  --ieee-title:#9db4ca;
  --ieee-sub:#5b7089;
  --ieee-zero:#b9cbdd;

  --foot:#4d6073;
  --foot-copy:#405364;
  --foot-sep:#2b3a48;
  --kbd-bg:#151f2a;
  --kbd-line:#243140;
  --kbd-txt:#7b8da1;

  --ver-bg:#14251f;
  --ver-line:#2b4a41;
  --ver-txt:#6ff0cd;

  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}

/* 明亮主题：白底纸面感，强调色整体压深以保证对比度（浅绿在白底上会看不清） */
html[data-theme="light"]{
  color-scheme: light;

  --bg:#eef2f7;
  --glow1:rgba(53,214,172,.20);
  --glow2:rgba(124,96,220,.12);
  --card-grad:linear-gradient(180deg,#ffffff 0%, #fafcfe 100%);
  --card-shadow:0 14px 28px -22px rgba(24,45,70,.30);

  --panel2:#e9eef5;
  --line:#d7e0ea;

  --txt:#16222f;
  --dim:#5f7186;

  --accent:#0a8768;
  --purple:#7a4fd0;
  --orange:#b3730f;
  --red:#cf3b47;
  --teal:#0d8f85;

  --sunken:#f7fafc;
  --sunken-line:#e0e7f0;
  --field-line:#cfd9e5;
  --field-focus:#5cb79d;
  --focus-ring:rgba(10,135,104,.15);

  --seg-on-bg:#ffffff;
  --seg-on-line:#bfe0d4;

  --chip-bg:#f4f7fb;
  --chip-txt:#4f6176;

  --hexb-bg:#e8f4ef;
  --hexb-line:#b6dfd0;
  --hexb-txt:#0a7a5e;
  --hexb-hv-bg:#d7efe6;
  --hexb-hv-line:#7cc7ae;
  --hexb-hv-txt:#054e3c;

  --divider:#e9eff6;
  --divider2:#eef3f9;

  --tag:#7b8da1;
  --tlabel:#5a6d82;
  --rval:#16222f;
  --empty:#8b9aab;
  --sup:#8b9aab;
  --meta:#7b8da1;
  --hint:#8b9aab;
  --hl-grad:rgba(10,135,104,.07);
  --hl-t:#0a7a5e;

  --note:#5a6d82;
  --note-dot:#9db4ca;
  --note-warn:#9a6206;
  --note-ok:#0a8768;

  --btn-bg:#f4f7fb;
  --btn-line:#d3dce7;
  --btn-txt:#4c5f75;
  --btn-hv-bg:#e8f6f0;
  --btn-hv-line:#8bcdb8;
  --pri-bg:#e3f6ee;
  --pri-line:#8ed3bd;
  --pri-txt:#0a7a5e;
  --pri-hv:#d0efe4;

  --thumb:#c3d0de;
  --thumb-hv:#a6b8ca;

  --toast-bg:#ffffff;
  --toast-line:#cfdae6;
  --toast-txt:#0a7a5e;
  --toast-shadow:0 14px 34px -16px rgba(24,45,70,.24);

  --alt-bg:#f0f4f9;
  --alt-lbl:#7b8da1;
  --alt-val:#4a5d73;
  --sep:#b9c8d8;

  --kv-line:#e4ebf3;
  --kv-label:#7b8da1;
  --kv-val:#1e2c3a;
  --ieee-title:#41556b;
  --ieee-sub:#7b8da1;
  --ieee-zero:#5f7186;

  --foot:#8b9aab;
  --foot-copy:#98a7b8;
  --foot-sep:#ccd7e3;
  --kbd-bg:#eef2f7;
  --kbd-line:#d3dce7;
  --kbd-txt:#5f7186;

  --ver-bg:#e7f7f1;
  --ver-line:#b7e3d5;
  --ver-txt:#0a7a5e;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1000px 520px at 10% -10%, var(--glow1), transparent 62%),
    radial-gradient(820px 440px at 94% 0%, var(--glow2), transparent 60%),
    var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 容器宽度与 UDS 工具箱（uds-toolbox.html）对齐：1560 封顶、居中，
   两边留白一致，两个工具并排看是一套东西。窗口再宽也不无限拉伸。 */
.wrap{max-width:1560px;margin:0 auto;padding:20px 22px 60px}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:13px}
.logo{
  width:46px;height:46px;border-radius:12px;flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;line-height:1;
  color:#062b23;
  background:linear-gradient(145deg,#4ce8bd,#1fa989);
  box-shadow:0 6px 22px -6px rgba(53,214,172,.55), inset 0 1px 0 rgba(255,255,255,.5);
}
.logo span{display:block}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.ver{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;
  color:var(--ver-txt);background:var(--ver-bg);border:1px solid var(--ver-line);border-radius:6px;
  padding:1px 6px;line-height:1.5;
}
.sub{margin:3px 0 0;font-size:12.5px;color:var(--dim)}
.opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{
  background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;
  padding:6px 12px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--seg-on-bg);color:var(--accent);box-shadow:inset 0 0 0 1px var(--seg-on-line)}

/* ---------- 主题：三档（系统 / 明亮 / 黑暗） ---------- */
/* 沿用 .seg 外观，只是每格多一个小图标，跟旁边「大小端」「大小写」区分开。
   三格等宽，切换不会让顶栏抖动。 */
.seg.theme button{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 10px;
}
.seg.theme button svg{
  width:12px;height:12px;flex:none;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}

/* ---------- 布局：左右两栏，两卡片等高固定 ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;align-items:stretch}
@media (max-width:1040px){.grid{grid-template-columns:1fr;align-items:start}}
/* 仅两栏时锁死等高；单列时放开，避免内容被裁。
   485 = 520 - 35，正好让出一行结果表（一行约 35px）的高度。 */
@media (min-width:1041px){
  .grid > .card{height:485px;overflow:hidden}
}

.card{
  background:var(--card-grad);
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px 16px 14px;
  display:flex;flex-direction:column;gap:12px;
  min-width:0;min-height:0;
  box-shadow:var(--card-shadow);
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-head h2{
  margin:0;font-size:13.5px;font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;gap:8px;
}
.card-head .hint{font-size:10.5px;color:var(--hint);font-family:var(--mono);letter-spacing:.02em}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.a{background:var(--accent);box-shadow:0 0 10px rgba(53,214,172,.8)}
.dot.b{background:var(--purple);box-shadow:0 0 10px rgba(177,139,250,.75)}
.dot.c{background:var(--orange);box-shadow:0 0 10px rgba(240,163,74,.75)}

/* ---------- 表单 ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{
  font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;
}
input[type=text],select,textarea{
  width:100%;
  background:var(--sunken);
  border:1px solid var(--field-line);
  color:var(--txt);
  border-radius:10px;
  padding:10px 12px;
  font-family:var(--mono);
  font-size:13.5px;
  outline:none;
  transition:.15s;
}
textarea{resize:none;line-height:1.6;height:84px;min-height:84px}
input[type=text]:focus,select:focus,textarea:focus{
  border-color:var(--field-focus);
  box-shadow:0 0 0 3px var(--focus-ring);
}
select{cursor:pointer;padding-right:28px}
select option,select optgroup{background:var(--sunken);color:var(--txt)}

.rowline{display:flex;gap:10px;align-items:flex-end}
.rowline > .grow{flex:1;min-width:0}

/* ---------- 示例 chips ---------- */
/* 示例按钮保持自然高度（0 0 auto），否则高度紧张时会被压成半行、按钮点不全 */
.chips{display:flex;gap:6px;flex-wrap:wrap;max-height:64px;overflow-y:auto;flex:0 0 auto}
.chips button{
  background:var(--chip-bg);border:1px solid var(--field-line);color:var(--chip-txt);
  font-family:var(--mono);font-size:11.5px;padding:4px 9px;border-radius:7px;
  cursor:pointer;transition:.15s;
}
.chips button:hover{color:var(--accent);border-color:var(--btn-hv-line);background:var(--btn-hv-bg)}

/* ---------- 输出区 ---------- */
/* min-height 只保底到「标题行 + 一条字节行 + 大端预览行」，不设 150：
   卡片总高收到 485 后，提示行多的时候要能从这里借高度，否则会溢出被卡裁掉 */
.out{display:flex;flex-direction:column;gap:9px;flex:1 1 auto;min-height:110px}
.out-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.out-head .lbl{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.meta{font-size:11.5px;color:var(--meta);font-family:var(--mono);text-align:right}
.meta .w{color:var(--orange)}

/* 字节序列：内容少时上下居中铺满，内容多时在框内纵向滚动。
   注意 align-content 必须用 safe center —— 普通 center 在内容溢出时会把
   顶部行推到滚动原点之外（滚不上去、首字节被永久裁掉）。
   overflow-x 显式 hidden，避免 overflow-y:auto 把 x 也带成 auto 多出一条横向条。 */
.hexline{
  display:flex;flex-wrap:wrap;gap:5px;align-items:center;
  align-content:center;
  align-content:safe center;
  overflow-y:auto;overflow-x:hidden;
  flex:1 1 auto;min-height:44px;padding:8px 10px;
  background:var(--sunken);border:1px solid var(--sunken-line);border-radius:10px;
  font-family:var(--mono);font-size:15px;
}
.hexline .b{
  background:var(--hexb-bg);border:1px solid var(--hexb-line);border-radius:7px;
  padding:3px 7px;color:var(--hexb-txt);letter-spacing:.05em;cursor:default;
  transition:.12s;
}
.hexline .b:hover{background:var(--hexb-hv-bg);color:var(--hexb-hv-txt);border-color:var(--hexb-hv-line)}
.hexline .gap{width:9px}
.hexline .none{color:var(--empty);font-size:12.5px}

.altline{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;padding-top:1px}
.altline .altlbl{
  font-size:10px;letter-spacing:.06em;color:var(--alt-lbl);text-transform:uppercase;
  background:var(--alt-bg);border:1px solid var(--sunken-line);border-radius:5px;padding:2px 6px;flex:none;
}
.altline .altval{color:var(--alt-val);letter-spacing:.06em;word-break:break-all}

/* ---------- 提示 ---------- */
/* notes 保持自然高度（0 0 auto）：它是文本，被压缩就只剩半行看不清；
   高度不足时让 hexline 先让位（它自己会滚动） */
.notes{display:flex;flex-direction:column;gap:5px;max-height:96px;overflow-y:auto;flex:0 0 auto}
.note{
  font-size:11.5px;color:var(--note);line-height:1.55;
  padding-left:13px;position:relative;
}
.note::before{content:"";position:absolute;left:2px;top:6px;width:4px;height:4px;border-radius:50%;background:var(--note-dot)}
.note.warn{color:var(--note-warn)}
.note.warn::before{background:var(--orange)}
.note.ok{color:var(--note-ok)}
.note.ok::before{background:var(--accent)}

/* ---------- 结果表 ---------- */
.results{
  display:flex;flex-direction:column;
  /* overflow-y:auto 会让 overflow-x 从 visible 变成 auto，横向一旦溢出就多出一条
     滚动条、并吃掉 9px 高度。这里显式压掉横向滚动，保证只在纵向滚。 */
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  border:1px solid var(--sunken-line);border-radius:11px;
  background:var(--sunken);
}
.rrow{
  display:grid;grid-template-columns:82px minmax(0,1fr) auto;
  gap:10px;align-items:baseline;
  padding:7px 12px;
  border-bottom:1px solid var(--divider);
  font-size:13px;
}
.rrow:last-child{border-bottom:0}
.rrow .t{color:var(--tlabel);font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
/* word-break:break-all 只保证能在「字符之间」断，遇到连续的标点（ascii 视图里的
   一长串 "."）仍会被 ICU 断行规则挡住而不换行，于是横向撑破容器。加 overflow-wrap:
   anywhere 作为兜底：只要有断行需求就任意处断开。 */
.rrow .v{font-family:var(--mono);color:var(--rval);word-break:break-all;overflow-wrap:anywhere;line-height:1.5}
.rrow .tag{font-size:10.5px;color:var(--tag);font-family:var(--mono);white-space:nowrap;text-align:right;min-width:88px}
.rrow.hl{background:linear-gradient(90deg,var(--hl-grad),transparent 70%)}
.rrow.hl .v{color:var(--accent)}
.rrow.hl .t{color:var(--hl-t)}

/* 成对两列一行：uint8 | int8、uint16 | int16 … */
.rrow.pair{grid-template-columns:1fr 1fr;padding:0;gap:0}
.rrow.pair .cell{
  display:grid;grid-template-columns:54px minmax(0,1fr) auto;
  gap:8px;align-items:baseline;padding:7px 10px;min-width:0;
}
.rrow.pair .cell + .cell{border-left:1px solid var(--divider2)}
.rrow.pair .cell.blank{border-left:1px solid var(--divider2)}
.rrow.pair .cell.hintcell{grid-template-columns:minmax(0,1fr) auto;border-left:1px solid var(--divider2)}
.rrow.pair .cell .tag{min-width:0;font-size:10px;letter-spacing:-.01em}
.hintv{color:var(--empty)}
.sup{color:var(--sup);font-size:11px;margin-left:2px;font-family:var(--mono)}
.empty{
  padding:16px 14px;color:var(--empty);font-size:12.5px;line-height:1.6;
  font-family:var(--mono);
}

/* ---------- IEEE 754 ---------- */
.bits{
  font-family:var(--mono);font-size:12px;line-height:2;
  background:var(--sunken);border:1px solid var(--sunken-line);border-radius:10px;
  padding:9px 12px;word-break:break-all;letter-spacing:.02em;
}
.bits .s{color:var(--orange)}
.bits .e{color:var(--purple)}
.bits .f{color:var(--teal)}
.bits .sep{color:var(--sep);padding:0 5px}
.ieee-blk{display:flex;flex-direction:column;gap:9px}
.ieee-title{
  display:flex;align-items:baseline;gap:8px;
  font-family:var(--mono);font-size:12.5px;color:var(--ieee-title);
}
.ieee-title b{color:var(--purple);font-weight:600;font-size:13px}
.ieee-title span{color:var(--ieee-sub);font-size:11px}
.kv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.kv{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:430px){.kv{grid-template-columns:1fr}}
.kv > div{
  background:var(--sunken);border:1px solid var(--kv-line);border-radius:9px;
  padding:7px 10px;display:flex;flex-direction:column;gap:3px;min-width:0;
}
.kv label{font-size:10.5px;color:var(--kv-label);letter-spacing:.06em;text-transform:uppercase}
.kv b{font-family:var(--mono);font-size:12.5px;color:var(--kv-val);font-weight:500;word-break:break-all}
/* 数值形式是「尾数₂ × 2^n」混排，优先在空格处换行，别把 × 2^n 拆开 */
.kv > div:last-child b{word-break:normal;overflow-wrap:anywhere;font-size:12px}
.kv b.acc{color:var(--accent)}
.kv b.pur{color:var(--purple)}

/* ---------- 按钮 ---------- */
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  background:var(--btn-bg);border:1px solid var(--btn-line);color:var(--btn-txt);
  font-family:var(--mono);font-size:12px;padding:7px 13px;border-radius:9px;
  cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{color:var(--accent);border-color:var(--btn-hv-line);background:var(--btn-hv-bg)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pri-bg);border-color:var(--pri-line);color:var(--pri-txt)}
.btn.primary:hover{background:var(--pri-hv)}

/* ---------- 卡片内滚动条 ---------- */
.hexline::-webkit-scrollbar,
.results::-webkit-scrollbar,.notes::-webkit-scrollbar,.chips::-webkit-scrollbar{width:9px;height:9px}
.hexline::-webkit-scrollbar-track,
.results::-webkit-scrollbar-track,.notes::-webkit-scrollbar-track,.chips::-webkit-scrollbar-track{background:transparent}
.hexline::-webkit-scrollbar-thumb,
.results::-webkit-scrollbar-thumb,.notes::-webkit-scrollbar-thumb,.chips::-webkit-scrollbar-thumb{
  background:var(--thumb);border-radius:6px;
}
.hexline::-webkit-scrollbar-thumb:hover,
.results::-webkit-scrollbar-thumb:hover,.notes::-webkit-scrollbar-thumb:hover,.chips::-webkit-scrollbar-thumb:hover{
  background:var(--thumb-hv);
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,14px);
  background:var(--toast-bg);border:1px solid var(--toast-line);color:var(--toast-txt);
  padding:9px 18px;border-radius:11px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99;
  box-shadow:var(--toast-shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* 页脚：端序说明 + 竖线分隔 + 版权。走普通文本流（不用 flex），竖线与版权包在
   同一个 nowrap 里，保证折行时竖线不会孤零零落在行首；text-wrap:balance 让窄屏
   下的两行长度均衡，避免最后一行只剩一个「前」字 */
.foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--foot);line-height:1.9;text-wrap:balance}
.foot-copy{white-space:nowrap;color:var(--foot-copy)}
.foot-sep{
  display:inline-block;width:1px;height:11px;background:var(--foot-sep);
  margin:0 12px;vertical-align:-1px;
}
@media (max-width:430px){.foot-sep{margin:0 8px}}
.foot kbd{
  font-family:var(--mono);background:var(--kbd-bg);border:1px solid var(--kbd-line);
  border-radius:5px;padding:1px 5px;font-size:10.5px;color:var(--kbd-txt);
}

/* ---------- 主题切换过渡 ---------- */
/* 只给「纯色面」加过渡，切换瞬间颜色平滑变化。
   body / .card 用的是渐变，渐变本身不可插值，会直接切过来（视觉上就是干脆的一下），
   所以这里不列它们，避免出现「一部分在动、一部分不动」的割裂感。
   注意不要把 .toast 写进来：它自带 opacity / transform 过渡，会被这条覆盖掉。 */
.hexline,.hexline .b,.results,.bits,.kv > div,
input[type=text],select,textarea,.seg,.seg button,.chips button,.btn,
.rrow .v,.rrow .t,.rrow .tag,.note,.empty,.altline .altval,.altline .altlbl,.foot,.foot kbd{
  transition:background-color .22s ease, border-color .22s ease, color .22s ease;
}
/* 系统开了「减少动态效果」就全部关掉，包括图标旋转 */
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo"><span>MEM</span><span>HEX</span></div>
      <div>
        <h1>MemoryViewer <span class="ver">V1.0.0</span></h1>
        <p class="sub">字符串 / 浮点 / 整数 ⇄ 原始字节 · 大小端可切换 · IEEE 754 位级拆解</p>

        <button type="button" data-pref="light" title="明亮主题"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.7v2.3M12 19v2.3M2.7 12h2.3M19 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>明亮</button>
        <button type="button" data-pref="dark" title="黑暗主题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 14.4A8.7 8.7 0 1 1 9.6 3.4a7.1 7.1 0 0 0 11 11z"/></svg>黑暗</button>

  <div class="grid">

              <option value="int8">int8（1 字节）</option>
              <option value="int16">int16（2 字节）</option>

              <option value="int64">int64（8 字节）</option>

              <option value="uint64">uint64（8 字节）</option>

      </label>

      <div class="chips" id="valChips"></div>

        <button class="btn" id="swapBytes">字节反转 →</button>

    <!-- ============ 字节 -> 值 ============ -->
    <section class="card">

        <h2><span class="dot b"></span>字节 → 值</h2>
      </div>

  <div class="foot">

  </div>
</div>

<script>
(function () {
  'use strict';

  var state = { le: true, upper: false };
  var lastLeftBytes = new Uint8Array(0);
  var hexSource = 'left';   /* 'left' = 由左侧数值同步而来，'manual' = 用户直接编辑 HEX */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    valInput: $('valInput'),
    typeSel: $('typeSel'),
    valHex: $('valHex'),
    valAlt: $('valAlt'),
    valMeta: $('valMeta'),
    valNotes: $('valNotes'),
    valChips: $('valChips'),
    hexInput: $('hexInput'),
    hexMeta: $('hexMeta'),
    results: $('results'),
    ieee: $('ieee'),
    ieeeSrc: $('ieeeSrc'),
    toast: $('toast')
  };

  /* ================= 工具函数 ================= */

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function hex2(b) {
    var s = b.toString(16).padStart(2, '0');
    return state.upper ? s.toUpperCase() : s;
  }

  function asciiOf(b) {
    return (b >= 0x20 && b <= 0x7e) ? String.fromCharCode(b) : '.';
  }

  function bytesToHexStr(bytes) {
    var parts = [];
    for (var i = 0; i < bytes.length; i++) parts.push(hex2(bytes[i]));
    return parts.join(' ');
  }

  function parseNumeric(s) {
    s = String(s).trim().replace(/_/g, '');
    if (!s) return null;
    if (/^[+-]?0[xX][0-9a-fA-F]+$/.test(s)) {
      var negX = s.charAt(0) === '-';
      var bodyX = s.replace(/^[+-]/, '');
      try {
        var bx = BigInt(bodyX);
        return { kind: 'bigint', value: negX ? -bx : bx };
      } catch (e) { return null; }
    }
    if (/^[+-]?0[bB][01]+$/.test(s) || /^[+-]?0[oO][0-7]+$/.test(s)) {
      var negB = s.charAt(0) === '-';
      try {
        var bb = BigInt(s.replace(/^[+-]/, ''));
        return { kind: 'bigint', value: negB ? -bb : bb };
      } catch (e) { return null; }
    }
    if (/^[+-]?\d+$/.test(s)) {
      try { return { kind: 'bigint', value: BigInt(s) }; } catch (e) { return null; }
    }
    var n = Number(s);
    if (!isNaN(n)) return { kind: 'number', value: n };
    return null;
  }

  function parseFloatLoose(s) {
    var t = String(s).trim();
    if (!t) return null;
    var k = t.toLowerCase();
    var special = {
      'nan': NaN, '+nan': NaN, '-nan': NaN,
      'inf': Infinity, '+inf': Infinity, 'infinity': Infinity, '+infinity': Infinity,
      '-inf': -Infinity, '-infinity': -Infinity
    };
    if (Object.prototype.hasOwnProperty.call(special, k)) return special[k];
    var n = Number(t);
    return isNaN(n) ? null : n;
  }

  function intRange(type) {
    var bits = parseInt(type.replace(/\D/g, ''), 10);
    var signed = type.charAt(0) === 'i';
    var m = BigInt(bits);
    if (signed) return [-(1n << (m - 1n)), (1n << (m - 1n)) - 1n];
    return [0n, (1n << m) - 1n];
  }

  function fmtFloat(v, w) {
    if (Number.isNaN(v)) return 'NaN';
    if (v === Infinity) return 'Infinity';
    if (v === -Infinity) return '-Infinity';
    if (Object.is(v, -0)) return '-0';
    var p = (w === 4) ? 9 : 17;
    return String(Number(v.toPrecision(p)));
  }

  function resolveAuto(raw) {
    var s = String(raw).trim();
    if (!s) return { type: 'string', note: '自动识别：字符串 (UTF-8)' };

    if (/^[+-]?(0[xX][0-9a-fA-F]+|0[bB][01]+|0[oO][0-7]+|\d+)$/.test(s)) {
      var p = parseNumeric(s);
      if (p && typeof p.value === 'bigint') {
        var b = p.value;
        if (b >= -2147483648n && b <= 2147483647n) return { type: 'int32', note: '自动识别：int32（4 字节）' };
        if (b >= 0n && b <= 4294967295n) return { type: 'uint32', note: '自动识别：uint32（4 字节）' };
        if (b >= -9223372036854775808n && b <= 9223372036854775807n) return { type: 'int64', note: '自动识别：int64（8 字节）' };
        if (b >= 0n && b <= 18446744073709551615n) return { type: 'uint64', note: '自动识别：uint64（8 字节）' };
        return { type: 'int64', note: '自动识别：int64（8 字节）', warn: '数值超出 64 位可表示范围，将按补码回绕' };
      }
    }
    if (Number.isFinite(Number(s))) return { type: 'float64', note: '自动识别：float64（8 字节，含小数点 / 指数）' };
    return { type: 'string', note: '自动识别：字符串 (UTF-8)' };
  }

  /* ================= 值 -> 字节 ================= */

  function analyzeValue() {
    var raw = els.valInput.value;
    var sel = els.typeSel.value;
    var type = sel;
    var notes = [];
    var warns = [];

    if (sel === 'auto') {
      var a = resolveAuto(raw);
      type = a.type;
      if (a.note) notes.push(a.note);
      if (a.warn) warns.push(a.warn);
    }

    var res = { bytes: new Uint8Array(0), type: type, notes: notes, warns: warns };
    if (!raw.trim()) return res;

    if (type === 'string') {
      var enc = new TextEncoder();
      res.bytes = enc.encode(raw);
      notes.push(raw.length + ' 个字符 → UTF-8 编码 ' + res.bytes.length + ' 字节');
      var nonAscii = Array.prototype.some.call(res.bytes, function (b) { return b > 127; });
      if (nonAscii) notes.push('含非 ASCII 字符，中文按 UTF-8 占 3 字节');
      return res;
    }

    if (type === 'float32' || type === 'float64') {
      var n = parseFloatLoose(raw);
      if (n === null) { warns.push('无法解析为浮点数'); return res; }
      var w = (type === 'float32') ? 4 : 8;
      var buf = new ArrayBuffer(w);
      var dv = new DataView(buf);
      if (w === 4) dv.setFloat32(0, n, state.le); else dv.setFloat64(0, n, state.le);
      var back = (w === 4) ? dv.getFloat32(0, state.le) : dv.getFloat64(0, state.le);
      res.bytes = new Uint8Array(buf);

      if (Number.isFinite(n) && !Number.isFinite(back)) {
        warns.push(type + ' 无法表示该值，溢出为 ' + fmtFloat(back, w));
      } else if (Number.isFinite(n) && !Object.is(back, n)) {
        notes.push(type + ' 精度有限，实际存储值为 ' + fmtFloat(back, w));
      }
      return res;
    }

    /* 整数 */
    var p = parseNumeric(raw);
    if (!p) { warns.push('无法解析为数值'); return res; }

    var big;
    if (typeof p.value === 'bigint') {
      big = p.value;
    } else {
      if (!Number.isFinite(p.value)) { warns.push('整数类型无法存储 NaN / Infinity'); return res; }
      if (!Number.isInteger(p.value)) warns.push('输入含小数部分，已向零截断为整数');
      big = BigInt(Math.trunc(p.value));
    }

    var bits = parseInt(type.replace(/\D/g, ''), 10);
    var width = bits / 8;
    var rng = intRange(type);
    if (big < rng[0] || big > rng[1]) {
      warns.push('超出 ' + type + ' 范围 [' + rng[0] + ', ' + rng[1] + ']，按补码 / 截断存储');
    }

    var m = 1n << BigInt(bits);
    var wrapped = ((big % m) + m) % m;
    var ab = new ArrayBuffer(width);
    var adv = new DataView(ab);
    if (bits === 8) adv.setUint8(0, Number(wrapped));
    else if (bits === 16) adv.setUint16(0, Number(wrapped), state.le);
    else if (bits === 32) adv.setUint32(0, Number(wrapped), state.le);
    else adv.setBigUint64(0, wrapped, state.le);
    res.bytes = new Uint8Array(ab);

    var hexWidth = width * 2;
    if (p.kind === 'bigint' && big < 0n) {
      notes.push('负数补码：' + bits + ' 位下为 0x' + wrapped.toString(16).toUpperCase().padStart(hexWidth, '0'));
    }
    if (bits === 64) {
      notes.push('存储无符号值 ' + wrapped.toString() + '（0x' + wrapped.toString(16).toUpperCase().padStart(16, '0') + '）');
    }
    return res;
  }

  /* ================= HEX -> 字节 ================= */

  function parseHex(s) {
    var warn = '';
    var t = String(s || '').replace(/0[xX]/g, '');
    var tokens = t.split(/[\s,;:|_\-]+/).filter(Boolean);
    var digits = '';

    if (tokens.length > 1) {
      tokens.forEach(function (tk) {
        var d = tk.replace(/[^0-9a-fA-F]/g, '');
        if (!d) return;
        if (d.length === 1) {
          warn = warn || '存在 1 位十六进制片段，已按 0X 补齐';
          d = '0' + d;
        }
        digits += d;
      });
    } else {
      digits = t.replace(/[^0-9a-fA-F]/g, '');
    }

    if (!digits) return { bytes: new Uint8Array(0), warn: warn };
    if (digits.length % 2) {
      digits = '0' + digits;
      warn = warn || '十六进制位数为奇数，已在最前面补 0';
    }

    var out = new Uint8Array(digits.length / 2);
    for (var i = 0; i < out.length; i++) {
      out[i] = parseInt(digits.substr(i * 2, 2), 16);
    }
    return { bytes: out, warn: warn };
  }

  /* ================= 渲染：左侧 ================= */

  function renderLeft(opts) {
    opts = opts || {};
    var r = analyzeValue();
    lastLeftBytes = r.bytes;

    if (r.bytes.length) {
      var html = '';
      for (var i = 0; i < r.bytes.length; i++) {
        var b = r.bytes[i];
        html += '<span class="b" title="dec ' + b + ' · bin ' + b.toString(2).padStart(8, '0') + '">' + hex2(b) + '</span>';
        if ((i + 1) % 4 === 0 && i !== r.bytes.length - 1) html += '<span class="gap"></span>';
      }
      els.valHex.innerHTML = html;
    } else {
      els.valHex.innerHTML = '<span class="none">— 输入值后显示存储字节 —</span>';
    }

    var meta = '';
    if (r.bytes.length) {
      meta = r.bytes.length + ' 字节';
      /* 字符串是 UTF-8 字节流，没有字节序概念，不标端序 */
      if (r.bytes.length <= 8 && r.type !== 'string') {
        meta += ' · ' + (state.le ? '小端 LE' : '大端 BE');
      }
    }
    els.valMeta.innerHTML = meta;

    /* 相反字节序对照（字符串是纯字节序列，不受字节序影响） */
    if (r.bytes.length > 1 && r.type !== 'string') {
      var rev = [];
      for (var k = r.bytes.length - 1; k >= 0; k--) rev.push(hex2(r.bytes[k]));
      els.valAlt.innerHTML = '<span class="altlbl">' + (state.le ? '大端 BE' : '小端 LE')
        + '</span><span class="altval">' + rev.join(' ') + '</span>';
      els.valAlt.style.display = 'flex';
    } else {
      els.valAlt.style.display = 'none';
      els.valAlt.innerHTML = '';
    }

    var notesHtml = '';
    r.notes.forEach(function (t) { notesHtml += '<div class="note">' + esc(t) + '</div>'; });
    r.warns.forEach(function (t) { notesHtml += '<div class="note warn">' + esc(t) + '</div>'; });
    els.valNotes.innerHTML = notesHtml;

    /* 左侧产出的字节同步到右侧，让下方的 IEEE / 明细卡片始终跟随最新输入 */
    if (opts.sync && r.bytes.length) {
      els.hexInput.value = bytesToHexStr(r.bytes);
      hexSource = 'left';
    }
  }

  /* ================= 渲染：右侧结果 ================= */

  function renderResults(bytes) {
    if (!bytes.length) {
      els.results.innerHTML = '<div class="empty">输入十六进制字节后，这里会列出它们按各种类型解释的结果。</div>';
      return;
    }
    var ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
    var dv = new DataView(ab);
    var n = bytes.length;
    var cells = [];   /* 成对显示：uint/int 同宽两两一行 */
    var tail = [];    /* 整行显示：提示、string、ascii */

    /* 注意：读取必须惰性求值。写成 push('uint16', 2, String(dv.getUint16(...)))
       会让 getUint16 在 n<2 时先于长度判断执行，DataView 越界抛 RangeError，
       异常被 dispatchEvent 吞掉后结果表会停在上一次的内容。 */
    function push(name, w, fn, tag) {
      if (n < w) return;
      var trim = (n > w) ? ('前 ' + w + ' 字节') : '';
      cells.push({ t: name, v: fn(), tag: tag || trim });
    }

    function cellHtml(c) {
      if (!c) return '<div class="cell blank"></div>';
      return '<div class="cell">'
        + '<span class="t">' + c.t + '</span>'
        + '<span class="v">' + c.v + '</span>'
        + '<span class="tag">' + esc(c.tag) + '</span>'
        + '</div>';
    }

    push('uint8', 1, function () { return String(dv.getUint8(0)); });
    push('int8', 1, function () { return String(dv.getInt8(0)); });
    push('uint16', 2, function () { return String(dv.getUint16(0, state.le)); });
    push('int16', 2, function () { return String(dv.getInt16(0, state.le)); });
    push('uint32', 4, function () { return String(dv.getUint32(0, state.le)); });
    push('int32', 4, function () { return String(dv.getInt32(0, state.le)); });

    if (n >= 8) {
      push('uint64', 8, function () { return dv.getBigUint64(0, state.le).toString(); });
      push('int64', 8, function () { return dv.getBigInt64(0, state.le).toString(); });
    }

    if (n >= 4) push('float32', 4, function () { return fmtFloat(dv.getFloat32(0, state.le), 4); });
    if (n >= 8) push('float64', 8, function () { return fmtFloat(dv.getFloat64(0, state.le), 8); });

    /* 字节不够时的提示：若最后一行左格已占、右格空着，就把提示填进右格，
       避免它另起一行（例如 4 字节时 float32 右侧的空白）。 */
    var hint = '';
    if (n < 8) {
      var need = [];
      if (n < 2) need.push('2');
      if (n < 4) need.push('4');
      if (n < 8) need.push('8');
      hint = '更多类型需要 ' + need.join(' / ') + ' 字节';
    }

    var html = '';
    for (var k = 0; k < cells.length; k += 2) {
      var right;
      if (cells[k + 1]) {
        right = cellHtml(cells[k + 1]);
      } else if (hint) {
        right = '<div class="cell hintcell">'
          + '<span class="v hintv">' + esc(hint) + '</span>'
          + '<span class="tag">当前 ' + n + ' 字节</span></div>';
        hint = '';
      } else {
        right = '<div class="cell blank"></div>';
      }
      html += '<div class="rrow pair">' + cellHtml(cells[k]) + right + '</div>';
    }

    if (hint) {
      tail.push('<div class="rrow"><span class="t">—</span><span class="v hintv">'
        + esc(hint) + '（当前 ' + n + ' 字节）</span><span class="tag"></span></div>');
    }

    var str = '';
    var validUtf8 = true;
    try {
      str = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (e) {
      validUtf8 = false;
      str = new TextDecoder('utf-8').decode(bytes);
    }
    var printable = '';
    for (var i = 0; i < bytes.length; i++) printable += asciiOf(bytes[i]);

    tail.push(
      '<div class="rrow hl"><span class="t">string</span>' +
      '<span class="v">' + (str ? esc(str) : '<span class="hintv">（空 / 不可见）</span>') +
      (validUtf8 ? '' : '<span class="sup">含非法 UTF-8 序列</span>') + '</span>' +
      '<span class="tag">UTF-8</span></div>'
    );
    tail.push(
      '<div class="rrow"><span class="t">ascii</span>' +
      '<span class="v">' + esc(printable) + '</span>' +
      '<span class="tag">可打印视图</span></div>'
    );

    els.results.innerHTML = html + tail.join('');
  }

  /* ================= 渲染：IEEE 754 ================= */

  function ieeeBlock(bytes, w) {
    var is32 = (w === 4);
    var eBits = is32 ? 8 : 11;
    var fBits = is32 ? 23 : 52;
    var bias = is32 ? 127 : 1023;
    var maxExp = is32 ? 255 : 2047;

    var ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + w);
    var dv = new DataView(ab);
    var bits, v;
    if (is32) {
      bits = dv.getUint32(0, state.le).toString(2).padStart(32, '0');
      v = dv.getFloat32(0, state.le);
    } else {
      bits = dv.getBigUint64(0, state.le).toString(2).padStart(64, '0');
      v = dv.getFloat64(0, state.le);
    }

    var sStr = bits.slice(0, 1);
    var eStr = bits.slice(1, 1 + eBits);
    var fStr = bits.slice(1 + eBits);
    var expRaw = parseInt(eStr, 2);
    var fracBig = fStr ? BigInt('0b' + fStr) : 0n;

    /* 分类颜色用 CSS 变量，切换主题时跟着变（内联 style 支持 var()） */
    var cls, clsColor = 'var(--ieee-zero)';
    if (expRaw === 0 && fracBig === 0n) { cls = 'Zero（零）'; }
    else if (expRaw === 0) { cls = 'Subnormal（非规格化数）'; clsColor = 'var(--orange)'; }
    else if (expRaw === maxExp && fracBig === 0n) { cls = 'Infinity（无穷大）'; clsColor = 'var(--red)'; }
    else if (expRaw === maxExp) { cls = 'NaN（非数）'; clsColor = 'var(--red)'; }
    else { cls = 'Normal（规格化数）'; clsColor = 'var(--accent)'; }

    var fracHexLen = is32 ? 6 : 13;
    var fracHex = fracBig.toString(16).toUpperCase().padStart(fracHexLen, '0');
    var expDec = expRaw - bias;

    var normalForm = '';
    if (expRaw !== maxExp) {
      if (expRaw === 0) {
        normalForm = '0.' + fStr + '₂ × 2<sup>' + (-bias) + '</sup>';
      } else {
        normalForm = '1.' + fStr + '₂ × 2<sup>' + expDec + '</sup>';
      }
    } else {
      normalForm = '—（指数全 1，特殊值）';
    }

    var signTxt = (sStr === '1' ? '1 → 负 (−)' : '0 → 正 (+)');

    var html = '';
    html += '<div class="ieee-blk">';
    html += '<div class="ieee-title"><b>float' + (is32 ? '32' : '64') + '</b><span>IEEE 754 binary'
      + (is32 ? '32' : '64') + ' · 符号 1 位 / 指数 ' + eBits + ' 位 / 尾数 ' + fBits + ' 位</span></div>';

    html += '<div class="bits">'
      + '<span class="s">' + sStr + '</span><span class="sep">|</span>'
      + '<span class="e">' + eStr + '</span><span class="sep">|</span>'
      + '<span class="f">' + fStr + '</span></div>';

    html += '<div class="kv">';
    html += '<div><label>符号位</label><b>' + signTxt + '</b></div>';
    html += '<div><label>指数（原始 / 偏置 ' + bias + '）</label><b class="pur">' + expRaw + ' → ' + expDec + '</b></div>';
    html += '<div><label>尾数（' + fBits + ' 位）</label><b class="pur">0x' + fracHex + '</b></div>';
    html += '<div><label>分类</label><b style="color:' + clsColor + '">' + cls + '</b></div>';
    html += '<div><label>解析值</label><b class="acc">' + esc(fmtFloat(v, w)) + '</b></div>';
    html += '<div><label>数值形式</label><b style="font-size:11.5px">' + normalForm + '</b></div>';
    html += '</div></div>';
    return html;
  }

  /* 互斥显示：≥8 字节只看 float64，4~7 字节只看 float32，不并列 */
  function renderIEEE(bytes) {
    var html = '';
    if (bytes.length >= 8) html = ieeeBlock(bytes, 8);
    else if (bytes.length >= 4) html = ieeeBlock(bytes, 4);
    if (!html) {
      html = '<div class="empty">需要至少 4 个字节才能解析 float32（8 个字节解析 float64）。<br>当前只有 '
        + bytes.length + ' 个字节。</div>';
    }
    els.ieee.innerHTML = html;
  }

  /* ================= 渲染：右侧总控 ================= */

  function renderRight() {
    var r = parseHex(els.hexInput.value);
    var bytes = r.bytes;

    var meta = bytes.length ? (bytes.length + ' 字节 · ' + (state.le ? '小端 LE' : '大端 BE')) : '';
    if (bytes.length && hexSource === 'left') meta += ' · 同步自左侧';
    els.hexMeta.innerHTML = meta + (r.warn ? '<span class="w"> · ' + esc(r.warn) + '</span>' : '');

    /* 标明下方两张卡片当前解析的是谁的数据 */
    if (bytes.length >= 4) {
      els.ieeeSrc.textContent = '← ' + (hexSource === 'left' ? '左侧数值' : 'HEX 输入')
        + ' · 前 ' + (bytes.length >= 8 ? '8' : '4') + ' 字节';
    } else {
      els.ieeeSrc.textContent = '需要 ≥ 4 字节';
    }

    renderResults(bytes);
    renderIEEE(bytes);
  }

  function onValueChange() {
    renderLeft({ sync: true });
    renderRight();
  }

  /* 切换端序 / 大小写时重新渲染。
     若右侧字节是用户手动编辑的（或点过字节反转），不要覆盖，只重新解析。 */
  function renderAll() {
    if (hexSource === 'left') renderLeft({ sync: true });
    else renderLeft();
    renderRight();
  }

  /* ================= 交互 ================= */

  var samples = [
    { label: '3.14 (f32)', v: '3.14', t: 'float32' },
    { label: '0.1 (f32 精度)', v: '0.1', t: 'float32' },
    { label: '-1 (int8)', v: '-1', t: 'int8' },
    { label: '0x7FFFFFFF', v: '0x7FFFFFFF', t: 'int32' },
    { label: 'uint64 最大', v: '18446744073709551615', t: 'uint64' },
    { label: '1e-40 (f32 非规格化)', v: '1e-40', t: 'float32' },
    { label: 'NaN (f32)', v: 'NaN', t: 'float32' },
    { label: '"abc"', v: 'abc', t: 'string' },
    { label: '"温度"', v: '温度', t: 'string' }
  ];

  function buildChips() {
    els.valChips.innerHTML = samples.map(function (s, i) {
      return '<button data-i="' + i + '">' + esc(s.label) + '</button>';
    }).join('');
  }

  els.valChips.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-i]');
    if (!btn) return;
    var s = samples[Number(btn.getAttribute('data-i'))];
    els.valInput.value = s.v;
    els.typeSel.value = s.t;
    onValueChange();
  });

  els.valInput.addEventListener('input', onValueChange);
  els.typeSel.addEventListener('change', onValueChange);

  els.hexInput.addEventListener('input', function () {
    hexSource = 'manual';
    renderRight();
  });

  $('endianSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-le]');
    if (!btn) return;
    state.le = btn.getAttribute('data-le') === '1';
    [].forEach.call(this.querySelectorAll('button'), function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
    renderAll();
  });

  $('caseSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-upper]');
    if (!btn) return;
    state.upper = btn.getAttribute('data-upper') === '1';
    [].forEach.call(this.querySelectorAll('button'), function (b) { b.classList.remove('on'); });
    btn.classList.add('on');
    renderAll();
  });

  var toastTimer = null;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.classList.remove('show'); }, 1600);
  }

  function copyText(text) {
    if (!text) { toast('没有可复制的内容'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制到剪贴板'); },
        function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板'); }
    catch (e) { toast('复制失败，请手动选中'); }
    document.body.removeChild(ta);
  }

  $('copyHex').addEventListener('click', function () {
    if (!lastLeftBytes.length) { toast('左侧还没有字节'); return; }
    var parts = [];
    for (var i = 0; i < lastLeftBytes.length; i++) parts.push(hex2(lastLeftBytes[i]));
    copyText(parts.join(' '));
  });

  $('copyC').addEventListener('click', function () {
    if (!lastLeftBytes.length) { toast('左侧还没有字节'); return; }
    var lines = [];
    for (var i = 0; i < lastLeftBytes.length; i += 12) {
      var chunk = [];
      for (var j = i; j < Math.min(i + 12, lastLeftBytes.length); j++) {
        chunk.push('0x' + hex2(lastLeftBytes[j]));
      }
      lines.push('    ' + chunk.join(', '));
    }
    var code = 'const unsigned char data[' + lastLeftBytes.length + '] = {\n'
      + lines.join(',\n') + '\n};';
    copyText(code);
  });

  /* 字节解析：把左侧字节原样送到右侧，不改变顺序 */
  $('parseBytes').addEventListener('click', function () {
    if (!lastLeftBytes.length) { toast('左侧还没有字节'); return; }
    els.hexInput.value = bytesToHexStr(lastLeftBytes);
    hexSource = 'left';
    renderRight();
    toast('已原样复制到右侧');
  });

  $('swapBytes').addEventListener('click', function () {
    if (!lastLeftBytes.length) { toast('左侧还没有字节'); return; }
    var rev = Array.prototype.slice.call(lastLeftBytes).reverse();
    els.hexInput.value = rev.map(function (b) { return hex2(b); }).join(' ');
    hexSource = 'manual';
    renderRight();
    toast('已反转字节 → 切到「' + (state.le ? '大端 BE' : '小端 LE') + '」即为原值');
  });

  /* ================= 主题（系统 / 明亮 / 黑暗） ================= */
  /* 只改 <html> 上的两个属性，所有颜色由 CSS 变量接管，这里不碰任何具体色值。
     data-theme-pref = 用户选择；data-theme = 实际生效的主题（system 时才去问系统）。 */

  var THEME_KEY = 'mv-theme';
  var DEFAULT_THEME = 'system';
  var themeSeg = $('themeSeg');
  var mqLight = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;

  function normalizePref(v) {
    return (v === 'system' || v === 'light' || v === 'dark') ? v : DEFAULT_THEME;
  }

  /* 每次启动都以首帧脚本写下的偏好为准；读不到就是 system */
  var themePref = normalizePref(document.documentElement.getAttribute('data-theme-pref'));

  function systemTheme() {
    return (mqLight && mqLight.matches) ? 'light' : 'dark';
  }

  function resolveTheme(pref) {
    return (pref === 'system') ? systemTheme() : pref;
  }

  function paintTheme() {
    var theme = resolveTheme(themePref);
    var root = document.documentElement;
    root.setAttribute('data-theme-pref', themePref);
    root.setAttribute('data-theme', theme);

    [].forEach.call(themeSeg.querySelectorAll('button'), function (b) {
      var p = b.getAttribute('data-pref');
      var on = (p === themePref);
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.title = (p === 'system')
        ? '跟随系统外观（系统当前：' + (systemTheme() === 'light' ? '明亮' : '黑暗') + '）'
        : (p === 'light' ? '明亮主题' : '黑暗主题');
    });
    return theme;
  }

  function setPref(pref, remember) {
    themePref = normalizePref(pref);
    var theme = paintTheme();
    if (!remember) return theme;

    try { localStorage.setItem(THEME_KEY, themePref); } catch (e) {}
    /* 桌面版（pywebview）里额外把选择落盘：窗口底色在页面加载前就要定，
       那时还读不到 localStorage。浏览器里没有这个 API，静默跳过。 */
    try {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.save_theme) {
        window.pywebview.api.save_theme(themePref);
      }
    } catch (e) {}
    return theme;
  }

  themeSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-pref]');
    if (!btn) return;
    var theme = setPref(btn.getAttribute('data-pref'), true);
    toast(themePref === 'system'
      ? '已跟随系统（当前' + (theme === 'light' ? '明亮' : '黑暗') + '）'
      : (theme === 'light' ? '已切换到明亮主题' : '已切换到黑暗主题'));
  });

  /* 系统外观变化：只在「跟随系统」模式下实时切换，别覆盖用户的显式选择 */
  if (mqLight) {
    var onSysTheme = function () {
      if (themePref === 'system') paintTheme();
    };
    if (mqLight.addEventListener) mqLight.addEventListener('change', onSysTheme);
    else if (mqLight.addListener) mqLight.addListener(onSysTheme);
  }

  /* 把三格的高亮状态与首帧脚本已设好的属性对齐 */
  paintTheme();

  /* ================= 初始化 ================= */

  buildChips();
  els.valInput.value = '3.14';
  els.typeSel.value = 'float32';
  renderAll();
})();
</script>

<script>
/* 与首页 index.html 同款三档主题控件：沿用各工具原有主题逻辑，仅替换外观。 */
(function(){
  var ORDER=['system','light','dark'];
  var LABEL={system:'系统',light:'明亮',dark:'暗黑'};
  var TITLE={system:'跟随系统',light:'明亮',dark:'暗黑'};
  var SVG={
    system:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/></svg>',
    light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>',
    dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.4A8.6 8.6 0 1 1 9.6 3.5a6.9 6.9 0 0 0 10.9 10.9z"/></svg>'
  };
  var st=document.createElement('style');
  st.textContent="\n.fz-theme{--fz-bg:rgba(190,255,220,.07);--fz-line:rgba(210,255,230,.16);--fz-knob:rgba(190,255,220,.16);--fz-text:#eef7f1;--fz-dim:#9db5a7;--fz-strong:#ffffff;--fz-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:999px;background:var(--fz-bg);border:1px solid var(--fz-line);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);transition:background .35s ease,border-color .35s ease;font-family:inherit}\nhtml[data-theme=\"light\"] .fz-theme{--fz-bg:rgba(255,255,255,.6);--fz-line:rgba(18,60,36,.12);--fz-knob:#ffffff;--fz-text:#1a2c22;--fz-dim:#5f7768;--fz-strong:#0d1c13;--fz-shadow:0 2px 10px rgba(25,90,55,.16)}\n.fz-theme .knob{position:absolute;top:4px;left:4px;width:calc((100% - 8px) / 3);height:calc(100% - 8px);border-radius:999px;background:var(--fz-knob);transform:translateX(calc(var(--i,0) * 100%));transition:transform .34s cubic-bezier(.22,.61,.36,1),background .35s ease;box-shadow:var(--fz-shadow);pointer-events:none}\n.fz-theme button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border:0;border-radius:999px;background:none;color:var(--fz-dim);font:inherit;font-size:12px;line-height:1;cursor:pointer;transition:color .25s ease}\n.fz-theme button:hover{color:var(--fz-text)}\n.fz-theme button[aria-pressed=\"true\"]{color:var(--fz-strong)}\n.fz-theme button svg{width:14px;height:14px;flex:none}\n.fz-theme button:focus-visible{outline:2px solid rgba(79,201,148,.85);outline-offset:2px}\n@media(max-width:560px){.fz-theme button span{display:none}.fz-theme button{padding:8px 12px}}\n";
  document.head.appendChild(st);

  var old=document.querySelector("#themeSeg");
  if(!old||!old.parentNode) return;
  var box=document.createElement('div');
  box.className='fz-theme';
  box.setAttribute('role','group');
  box.setAttribute('aria-label','主题切换');
  
  box.innerHTML='<span class="knob" aria-hidden="true"></span>'+ORDER.map(function(m){
    return '<button type="button" data-mode="'+m+'" aria-pressed="false" title="'+TITLE[m]+'">'+SVG[m]+'<span>'+LABEL[m]+'</span></button>';
  }).join('');
  old.parentNode.insertBefore(box,old);
  old.style.display='none';

  function read(){
    var m=(document.documentElement.getAttribute('data-theme-pref'));
    if(m==='auto') m='system';
    return ORDER.indexOf(m)>=0 ? m : 'system';
  }
  function activate(m){
    var b=old.querySelector('button[data-pref="'+m+'"]');if(b) b.click();
    sync();
  }
  function sync(){
    var m=read(), i=ORDER.indexOf(m);
    box.style.setProperty('--i', i);
    ORDER.forEach(function(x){
      var b=box.querySelector('button[data-mode="'+x+'"]');
      if(b) b.setAttribute('aria-pressed', x===m?'true':'false');
    });
  }
  box.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('button[data-mode]'):null;
    if(b) activate(b.getAttribute('data-mode'));
  });
  if(window.MutationObserver){
    new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','data-theme-pref','data-mode']});
  }
  sync();
})();
</script>
